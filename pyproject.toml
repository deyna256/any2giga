[project]
name = "any2giga"
version = "0.1.0.dev0"
description = "An OpenAI-compatible API gateway for GigaChat."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "deyna256", email = "literallybugcreator@gmail.com" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
dependencies = [
    "gigachat>=0.2.3,<0.3",
    "litestar>=2.25.0,<3",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.10",
    "towncrier>=26.9.0",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
strict = true
testpaths = ["tests"]
timeout = 30

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "DTZ", "E", "F", "I", "LOG", "PGH", "PLE",
    "PLW", "PT", "RUF", "S", "SIM", "T10", "T20", "UP", "W",
]
# Timeouts can be part of an async operation's public contract.
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
# pytest uses assertions; these tests run controlled local commands.
"tests/**" = ["S101"]
"tests/test_release_notes.py" = ["S603"]
# This command writes release notes to stdout.
"tools/release_notes.py" = ["T201"]

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "#{issue}"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true
